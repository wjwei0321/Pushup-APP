<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.88">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F7F7F7">
</head>
<body>
    <div id="splashScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent-color); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 200px;">
        <div style="width: 90px; height: 90px; color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="100%" height="100%" viewBox="0 0 229 106" style="transform: scale(1.4) translateX(-6%);"><mask id="mask_Push-up"><image width="229" height="106" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOUAAABqCAYAAABDL5YbAAAHtUlEQVR4nO3deagVVQDH8e+omRVR2SIGFRXYgu2UUbiQJRVKBVYWRfpPGwVtUGCRUEQUUVC0+Udq2SaVUGQLiaCVFVq0oEa0SChWFJGFWjpx4Fyad3tP586bmbP9PvB4913uLHfu/b1z5sw5Z7I8zxERfwxxvQMi0pdCKeIZhVLEMwqliGcUShHPKJQinlEoRTyjUIp4RqEU8cww1zsgEpDDgB3AJmBbUxtRSSkysMVAXvj5HlgPbO16/jpqlKnvq0gfRwNrqGYpMJlBUihF/lPX6IyZwPyqC6v6KgIX1hhIYx7wbdWFFUpJ3f3Aaw2s93BgXZUFFUpJ2R3A7Q2ufwzwbK8L6ZxSUpa3tJ2DgY1lX6xQSqrylreXlX2hqq+SoqscbPOZsi9USSkpyh1tt1RpqZJSpD3nlnmRQimpmeNw23PLvEjVV0lN7nj7u6zCqqQU8YyGbonv9gMmAcfav38G/gI+tz/RUSjFF9OAm4DxwG4Vll/g6FJH7XROKa48BNzi4Lwtxy2dU4o3ZncNDG4qkNj1f0igVFJKU8woiWXAoZ6VTO8DZ+COSkpxMi4xt+MJXQeyv+rqrbjzXZkX6ZKIDMbJwEuFIDYxLrEOrxcer8SdUlV2VV+ljNPsZYnpwKmBHrIslL6vuiQixizgcuDsiA9HXgjFOOCjlrf/WNkXqqRMk+vGjhRLy6zsC3VOmY6bC+d+KQbSuIu+PYXaMrGXF6ukjN9oYIPrnfBIVnj8BTC24e29YE8NSlMo4/Zu5OeJdVQjm6zGbrTz8/REDT3xct2dLKSQbgF2r3m9nwEnVVlQ55TxGRVwIH+xtw1o24iar7HeWzWQhqqvcTFzjF5BmI4o9HjJHbaC5m21sg5E1dd4hFo6GnvYKqQP7yOrcNloLXBMXTugUMbB9Rd5MM7zKJBFZ3bdl/J8O9ZzX2C77V74HA1Q9TVs5r6IjxOu5cCEFgO51Z4/ek0lZbh8KlWq6gRyVUvbu4wAqKQMj6lWrSB8WWGkSVuhzAiASsqwxFA6GhcVHrcVyBkEQiVlGD4FTiQOvwEj7ePtLV4rzwiESkq/mekUDyAuIwulpQLZD/Xo8XtKjdgCObPw+NWWtpkRGFVf/RH7GMcdwFD7eIMdvdKU34EpwMcESKF0r+kvqC+ywjjGXxvaxvnAEgKnc0p3c960PR2FS8Wg/NpCFXU4sI1A6Zyy/VnV8sQC2SnBjHNqXu9xXYE804Zxq538OUgKZfMeLjTcTCU9xXlW36lxrGIGfGn/nmSP74rCfUg6rbzB0Tll/S61M5fF1nJaVVa4i3Ed53s3ds0MN9AA5cqDjF1TSTl4V3fdI+NFBbLPYN+OOgJ5SSGQE+zxHmjGgGA7W6ik7I254H0DcFZDn0ds6pzS8Rrg6R4Hcwd3jdJQ6+vOPWpDKL37oPD4+UEewJ8KgTR30zo95g9EJWVfpnXwCeBIR59HTOosJTP7+x7gzh6Wm2Jn9AtK6qE0rXbzPbk7lEumB8xt9nblpp1hM7CnfWwaUv4B9rHTJQ6zPXNMK+de9vd222PnT+AHYGnX+gfzJbve/qOssh4zr+vxBCa1UO4NPABc63pHPHFlU1NadMkdlrgZgUnlnDKVrmxlS0Uzz0wIfiRBsV8SWWf/uyqQsNqWGqEE0jiE/884Hr2YQ2nCOMb1TnhgrQ3jKYRvdkvLOBXrOWWUb6pHSwp9Tl1bU3Hm86yGz/Zv20E9GEMinXYxZTPsl9mXQGIb16r2lhqsTl/         </div>
        <div style="color: white; font-family: Outfit; font-weight: 600; font-size: 1.2rem; letter-spacing: 0.5px;">STRIVE TO EVOLVE</div>
    </div>
    <div class="container">
        <!-- View 1: Calendar Home -->
        <div id="homeView" style="position: relative; transition: transform 0.2s;">
            <!-- Pull to Refresh Indicator -->
            <div id="ptrIndicator" class="ptr-indicator">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6"></path>
                    <path d="M21 13a9 9 0 1 1-3-7.7L21 8"></path>
                </svg>
            </div>
            <header class="app-header">
                <div class="header-top" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="app-title" onclick="openSettings()" style="cursor: pointer;">STRIVE TO EVOLVE</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        
                        <div id="headerStatsBtn" onclick="switchView('stats')" style="background: var(--card-bg); border: 1.5px solid var(--border-color); color: var(--text-primary); border-radius: 10px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 12 6 12 9 21 15 3 18 12 22 12"></polyline></svg>
                        </div>
                    </div>
                </div>
            </header>

            <div class="calendar-card">
                <div class="calendar-header">
                    <h2 id="currentMonthYear">August 2026</h2>
                    <div class="calendar-controls">
                        <button class="icon-btn" onclick="prevMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button class="icon-btn" onclick="nextMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="days-grid" style="margin-bottom: 10px;">
                        <div class="weekday">S</div>
                        <div class="weekday">M</div>
                        <div class="weekday">T</div>
                        <div class="weekday">W</div>
                        <div class="weekday">T</div>
                        <div class="weekday">F</div>
                        <div class="weekday">S</div>
                    </div>
                    <div id="calendarDays" class="days-grid"></div>
                </div>
            </div>

            <div class="daily-log-section">
                <div class="daily-log-header">
                    <h3 id="selectedDateDisplay">Aug 25</h3>
                </div>
                <div id="dailyLogList" class="daily-log-list">
                    <!-- Logs injected here -->
                </div>
            </div>
            
        </div>
    </div>

    <!-- Stats View (TradingView Light Style as Modal) -->
    <div id="statsView" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000; background: #ffffff; color: var(--text-primary); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.3, 1); transform: translateY(100%); overflow-y: auto; padding-bottom: 50px; padding-top: env(safe-area-inset-top, 20px);">
        <!-- Drag Handle -->
        <div id="statsDragHandle" style="width: 100%; padding: 16px 0; display: flex; justify-content: center; touch-action: none;">
            <div style="width: 40px; height: 5px; background: #e0e0e0; border-radius: 3px;"></div>
        </div>
        
        <div style="padding: 0 20px;">
            <!-- TradingView Header -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div id="statsHeaderIcon" style="width: 42px; height: 42px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #f39c12; padding: 8px;">
                        <!-- Icon injected via JS -->
                    </div>
                    <div style="display: flex; flex-direction: column;">
                        <span id="statsHeaderTitle" style="font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary);">Exercise</span>
                        <span style="font-size: 0.75rem; color: #999; font-weight: 600; letter-spacing: 0.5px;">STRIVE TO EVOLVE</span>
                    </div>
                </div>
                
                <!-- Chart Toggle Button moved to Top Right -->
                <div id="btnChartToggle" onclick="toggleChartType()" style="background: var(--card-bg); border: 1.5px solid var(--border-color); color: var(--text-primary); border-radius: 10px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <!-- JS will inject icon -->
                </div>
            </div>

            <!-- Big Number -->
            <div style="margin-bottom: 32px; min-height: 80px;">
                <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;">
                    <span style="font-size: 3.2rem; font-weight: 800; color: #111; line-height: 1; letter-spacing: -1.5px;" id="statsTotalNumber">0</span>
                </div>
                <div style="display: flex; gap: 16px; align-items: center; min-height: 24px;">
                    <div id="statsTodayLabel" style="font-size: 0.95rem; color: #f39c12; font-weight: 600; letter-spacing: 0.2px; display: none;">+0 today</div>
                    <div id="statsWeeklyLabel" style="font-size: 0.95rem; color: #f39c12; font-weight: 600; letter-spacing: 0.2px; display: none;">+0 this week</div>
                </div>
            </div>
        </div>

        <!-- Chart Container Centered with Equal Margins -->
        <div style="padding: 0 6px;">
            <div style="width: 100%; height: 320px; position: relative; overflow: visible; touch-action: none;">
                <canvas id="statsChart" style="touch-action: none;"></canvas>
            </div>
        </div>

        <!-- Exercise Icon Bottom Bar (8 in a row) -->
        <div style="padding: 20px 20px; width: 100%; box-sizing: border-box;">
            <div id="statsExerciseFilter" style="display: flex; justify-content: space-between; padding: 0;">
                <!-- Icons injected via JS -->
            </div>
        </div>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="floating-nav">
        <div class="nav-item add-btn" onclick="openAddWorkoutModal()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
    </nav>

    <!-- Add Workout Modal -->
    <div class="modal" id="addWorkoutModal">
        <div class="modal-content add-workout-content" style="padding: 0; height: 100%; border-radius: 0;">
            <div id="stepSelectExercise" class="modal-step" style="height: 100%; display: flex; flex-direction: column; background: #fafafa;">
                <div style="padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 10px 20px; display: flex; flex-direction: column; align-items: center; touch-action: none; position: relative;">
                    <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; margin-bottom: 5px;"></div>
                </div>
                <div style="padding: 0 20px 20px 20px; flex: 1; overflow-y: auto;">
                    <div class="exercise-list-grid" id="exerciseListGrid" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Buttons injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Step 2: Input Reps -->
            <div id="stepInputReps" class="modal-step" style="display: none; padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 20px 20px; height: 100%; flex-direction: column; background: var(--bg-color);">
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%; touch-action: none;">
                    <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; margin-bottom: 20px;"></div>
                </div>
                <div class="modal-header">
                    <div style="width: 44px; height: 44px;"></div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <h3 id="selectedExerciseTitle" style="margin: 0; font-size: 1.2rem; font-weight: 700;">Exercise</h3>
                        <span id="selectedExerciseDate" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; font-weight: 500;"></span>
                    </div>
                    <div style="width: 44px; height: 44px;"></div> <!-- Spacer -->
                </div>
                
                <div id="selectedExerciseIconLarge" onclick="openExercisePicker()" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--accent-color); margin-bottom: 20px; cursor: pointer;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 20px; padding-bottom: env(safe-area-inset-bottom, 20px);">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%;">
                        <div style="border: 1.5px solid var(--border-color); border-radius: 12px; padding: 15px 0; text-align: center; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;">
                            <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">SETS</div>
                            <div id="modalSetsToday" style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">0</div>
                        </div>
                        <div style="border: 1.5px solid var(--border-color); border-radius: 12px; padding: 15px 0; text-align: center; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;">
                            <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">TOTAL</div>
                            <div id="modalTotalRepsToday" style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">0</div>
                        </div>
                    </div>

                    <div id="workoutRepsDisplay" style="width: 100%; box-sizing: border-box; text-align: center; font-size: 2.5rem; font-weight: 800; padding: 15px; border-radius: 16px; border: 2px solid var(--border-color); color: var(--text-primary);">0</div>
                    
                    <div class="quick-add-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                        <div class="quick-add-btn" onclick="addReps(1)">+1</div>
                        <div class="quick-add-btn" onclick="addReps(2)">+2</div>
                        <div class="quick-add-btn" onclick="addReps(5)">+5</div>
                        <div class="quick-add-btn" onclick="addReps(10)">+10</div>
                        <div class="quick-add-btn" onclick="addReps(20)">+20</div>
                        <div class="quick-add-btn clear-btn" onclick="clearReps()">C</div>
                    </div>

                    <div style="display: flex; justify-content: center;">
                        <button onclick="submitWorkout()" style="width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--accent-color); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); transition: transform 0.2s;">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="filterModal">
        <div class="modal-content" id="filterModalContent" style="padding: 0; background: #fafafa; height: 100%; border-radius: 0; display: flex; flex-direction: column;">
            <div id="filterModalHeader" style="padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 20px 20px; display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); touch-action: none; position: relative;">
                <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; align-self: center; margin-bottom: 15px;"></div>
                <div style="display: flex; justify-content: center; align-items: center; width: 100%;">
                    <h3 style="margin: 0; font-size: 1.2rem; font-weight: 700;">Select Exercises</h3>
                </div>
            </div>
            <div id="filterList" style="padding: 10px 20px 30px 20px; overflow-y: auto; flex: 1;">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

        <div class="modal" id="settingsModal">
        <div class="modal-content" style="padding: 0; background: #fafafa; border-radius: 20px 20px 0 0; display: flex; flex-direction: column;">
            <div style="padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 20px 20px; display: flex; flex-direction: column; touch-action: none; position: relative;">
                <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; align-self: center; margin-bottom: 15px;"></div>
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 700;">Settings & Profile</h3>
                    <div id="currentUserDisplay" style="margin-top: 5px; font-size: 0.9rem; color: var(--accent-color); font-weight: 600;">Not logged in</div>
                </div>
            </div>
            <div style="padding: 10px 20px 40px 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem;">Your Email (for sync)</label>
                <input type="email" id="userEmail" placeholder="e.g. user@gmail.com" style="width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border-color); background: var(--card-bg); font-family: Outfit; font-size: 1rem; margin-bottom: 20px; box-sizing: border-box;">
                
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem;">API URL (Apps Script)</label>
                <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/AKfycbxJjX.../exec" style="width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border-color); background: var(--card-bg); font-family: Outfit; font-size: 1rem; margin-bottom: 25px; box-sizing: border-box;">
                
                <button onclick="saveSettings()" style="width: 100%; padding: 16px; border-radius: 14px; border: none; background: #111; color: white; font-family: Outfit; font-weight: 700; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">Save & Sync</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast">Logged successfully!</div>

    <div class="modal" id="exercisePickerModal" style="z-index: 1000;" onclick="if(event.target===this) { this.classList.remove('show'); setTimeout(() => this.style.display = 'none', 300); }">
        <div class="modal-content" style="border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto;">
            <div style="width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 20px auto;"></div>
            <h3 style="margin-bottom: 20px; font-weight: 700; text-align: center;">Select Exercise</h3>
            <div id="exercisePickerList" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;"></div>
        </div>
    </div>

    <script src="app.js?v=3.87"></script>
</body>
</html>
