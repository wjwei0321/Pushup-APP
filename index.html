<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F7F7F7">
</head>
<body>
    <div class="container">
        <!-- View 1: Calendar Home -->
        <div id="homeView" style="position: relative; transition: transform 0.2s;">
            <!-- Pull to Refresh Indicator -->
            <div id="ptrIndicator" class="ptr-indicator">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6"></path>
                    <path d="M21 13a9 9 0 1 1-3-7.7L21 8"></path>
                </svg>
            </div>
            <header class="app-header">
                <div class="header-top" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="app-title">STRIVE TO EVOLVE</span>
                    </div>
                    <div class="filter-btn" onclick="openFilterModal()" id="headerFilterBtn">A</div>
                </div>
            </header>

            <div class="calendar-card">
                <div class="calendar-header">
                    <h2 id="currentMonthYear">August 2026</h2>
                    <div class="calendar-controls">
                        <button class="icon-btn" onclick="prevMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button class="icon-btn" onclick="nextMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="days-grid" style="margin-bottom: 10px;">
                        <div class="weekday">S</div>
                        <div class="weekday">M</div>
                        <div class="weekday">T</div>
                        <div class="weekday">W</div>
                        <div class="weekday">T</div>
                        <div class="weekday">F</div>
                        <div class="weekday">S</div>
                    </div>
                    <div id="calendarDays" class="days-grid"></div>
                </div>
            </div>

            <div class="daily-log-section">
                <div class="daily-log-header">
                    <h3 id="selectedDateDisplay">Aug 25</h3>
                </div>
                <div id="dailyLogList" class="daily-log-list">
                    <!-- Logs injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Stats View -->
    <div id="statsView" class="view-container" style="display: none; padding-bottom: 100px;">
        <div style="padding: calc(20px + env(safe-area-inset-top, 20px)) 24px 0 24px;">
            <!-- Header Row -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <span style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">Statistics</span>
                <div style="display: flex; gap: 6px;">
                    <div id="btnLineChart" class="stats-toggle-btn active" onclick="toggleChartType('line')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    </div>
                    <div id="btnBarChart" class="stats-toggle-btn" onclick="toggleChartType('bar')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-4"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Big Number -->
            <div style="margin-bottom: 24px;">
                <div style="font-size: 2.8rem; font-weight: 800; color: var(--text-primary); line-height: 1; letter-spacing: -1px; margin-bottom: 4px;" id="statsTotalNumber">0</div>
                <div style="font-size: 0.9rem; color: #999; font-weight: 600; letter-spacing: 0.5px;">TOTAL SETS</div>
            </div>

            <!-- Time Filter (Dark Segmented Control) -->
            <div class="stats-time-filter" style="margin-bottom: 24px;">
                <div class="time-filter-btn" onclick="setTimeFilter('3M')" id="tf-3M">3M</div>
                <div class="time-filter-btn" onclick="setTimeFilter('6M')" id="tf-6M">6M</div>
                <div class="time-filter-btn" onclick="setTimeFilter('1Y')" id="tf-1Y">1Y</div>
                <div class="time-filter-btn" onclick="setTimeFilter('ALL')" id="tf-ALL">ALL</div>
            </div>

            <!-- Exercise Filter Pills -->
            <div id="statsExerciseFilter" class="stats-pills-scroll" style="margin-bottom: 0;">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Chart Container Full Width -->
        <div style="width: 100%; height: 280px; position: relative; margin-top: 16px;">
            <canvas id="statsChart"></canvas>
        </div>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="floating-nav">
        <div class="nav-item active" onclick="switchView('home')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div class="nav-item add-btn" onclick="openAddWorkoutModal()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <div class="nav-item" onclick="switchView('stats')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-4"></path></svg>
        </div>
    </nav>

    <!-- Add Workout Modal -->
    <div class="modal" id="addWorkoutModal">
        <div class="modal-content add-workout-content" style="padding: 0; height: 100%; border-radius: 0;">
            <div id="stepSelectExercise" class="modal-step" style="height: 100%; display: flex; flex-direction: column; background: #fafafa;">
                <div style="padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 10px 20px; display: flex; flex-direction: column; align-items: center; touch-action: none; position: relative;">
                    <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; margin-bottom: 5px;"></div>
                </div>
                <div style="padding: 0 20px 20px 20px; flex: 1; overflow-y: auto;">
                    <div class="exercise-list-grid" id="exerciseListGrid" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Buttons injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Step 2: Input Reps -->
            <div id="stepInputReps" class="modal-step" style="display: none; padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 20px 20px; height: 100%; flex-direction: column; background: var(--bg-color);">
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%; touch-action: none;">
                    <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; margin-bottom: 20px;"></div>
                </div>
                <div class="modal-header">
                    <div style="width: 44px; height: 44px;"></div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <h3 id="selectedExerciseTitle" style="margin: 0; font-size: 1.2rem; font-weight: 700;">Exercise</h3>
                        <span id="selectedExerciseDate" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; font-weight: 500;"></span>
                    </div>
                    <div style="width: 44px; height: 44px;"></div> <!-- Spacer -->
                </div>
                
                <div id="selectedExerciseIconLarge" style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--accent-color); margin-bottom: 20px;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 20px; padding-bottom: env(safe-area-inset-bottom, 20px);">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%;">
                        <div style="border: 1.5px solid var(--border-color); border-radius: 12px; padding: 15px 0; text-align: center; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;">
                            <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">SETS</div>
                            <div id="modalSetsToday" style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">0</div>
                        </div>
                        <div style="border: 1.5px solid var(--border-color); border-radius: 12px; padding: 15px 0; text-align: center; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;">
                            <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">TOTAL</div>
                            <div id="modalTotalRepsToday" style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">0</div>
                        </div>
                    </div>

                    <div id="workoutRepsDisplay" style="width: 100%; box-sizing: border-box; text-align: center; font-size: 2.5rem; font-weight: 800; padding: 15px; border-radius: 16px; border: 2px solid var(--border-color); color: var(--text-primary);">0</div>
                    
                    <div class="quick-add-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                        <div class="quick-add-btn" onclick="addReps(1)">+1</div>
                        <div class="quick-add-btn" onclick="addReps(2)">+2</div>
                        <div class="quick-add-btn" onclick="addReps(5)">+5</div>
                        <div class="quick-add-btn" onclick="addReps(10)">+10</div>
                        <div class="quick-add-btn" onclick="addReps(20)">+20</div>
                        <div class="quick-add-btn clear-btn" onclick="clearReps()">C</div>
                    </div>

                    <div style="display: flex; justify-content: center;">
                        <button onclick="submitWorkout()" style="width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--accent-color); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); transition: transform 0.2s;">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="filterModal">
        <div class="modal-content" id="filterModalContent" style="padding: 0; background: #fafafa; height: 100%; border-radius: 0; display: flex; flex-direction: column;">
            <div id="filterModalHeader" style="padding: calc(20px + env(safe-area-inset-top, 20px)) 20px 20px 20px; display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); touch-action: none; position: relative;">
                <div style="width: 36px; height: 5px; background: #ddd; border-radius: 3px; align-self: center; margin-bottom: 15px;"></div>
                <div style="display: flex; justify-content: center; align-items: center; width: 100%;">
                    <h3 style="margin: 0; font-size: 1.2rem; font-weight: 700;">Select Exercises</h3>
                </div>
            </div>
            <div id="filterList" style="padding: 10px 20px 30px 20px; overflow-y: auto; flex: 1;">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Logged successfully!</div>

    <script src="app.js"></script>
</body>
</html>
