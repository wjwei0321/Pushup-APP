<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F7F7F7">
</head>
<body>
    <div class="container">
        <!-- Pull to Refresh Indicator -->
        <div id="ptrIndicator" class="ptr-indicator">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2v6h-6"></path>
                <path d="M21 13a9 9 0 1 1-3-7.7L21 8"></path>
            </svg>
        </div>
        <!-- View 1: Calendar Home -->
        <div id="homeView">
            <header class="app-header">
                <div class="header-top">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="app-title">STRIVE TO EVOLVE</span>
                    </div>
                </div>
            </header>

            <div class="calendar-card">
                <div class="calendar-header">
                    <h2 id="currentMonthYear">August 2026</h2>
                    <div class="calendar-controls">
                        <button class="icon-btn" onclick="prevMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button class="icon-btn" onclick="nextMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="days-grid" style="margin-bottom: 10px;">
                        <div class="weekday">S</div>
                        <div class="weekday">M</div>
                        <div class="weekday">T</div>
                        <div class="weekday">W</div>
                        <div class="weekday">T</div>
                        <div class="weekday">F</div>
                        <div class="weekday">S</div>
                    </div>
                    <div id="calendarDays" class="days-grid"></div>
                </div>
            </div>

            <div class="daily-log-section">
                <div class="daily-log-header">
                    <h3 id="selectedDateDisplay">Aug 25</h3>
                    <button class="icon-btn" onclick="openAddWorkoutModal()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                </div>
                <div id="dailyLogList" class="daily-log-list">
                    <!-- Logs injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="floating-nav">
        <div class="nav-item active" onclick="switchView('home')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div class="nav-item add-btn" onclick="openAddWorkoutModal()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <div class="nav-item" onclick="switchView('stats')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-4"></path></svg>
        </div>
    </nav>

    <!-- Add Workout Modal -->
    <div class="modal" id="addWorkoutModal">
        <div class="modal-content add-workout-content" style="padding: 0;">
            <!-- Step 1: Select Exercise -->
            <div id="stepSelectExercise" class="modal-step" style="height: 100%; display: flex; flex-direction: column; background: #fafafa;">
                <div style="padding: 30px 20px; flex: 1; overflow-y: auto;">
                    <h3 style="text-align: center; margin: 0 0 30px 0; font-size: 1.2rem; font-weight: 700;">Select exercise</h3>
                    <div class="exercise-list-grid" id="exerciseListGrid" style="display: flex; flex-direction: column; gap: 15px;">
                        <!-- Buttons injected via JS -->
                    </div>
                </div>
                <div class="modal-bottom-close" onclick="closeAddWorkoutModal()" style="padding: 20px; display: flex; justify-content: center; background: #fafafa; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;">
                    <div style="width: 64px; height: 54px; border: 1.5px solid var(--text-primary); border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: white;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
            </div>

            <!-- Step 2: Input Reps -->
            <div id="stepInputReps" class="modal-step" style="display: none; padding: 20px; height: 100%; flex-direction: column;">
                <div class="modal-header">
                    <button class="icon-btn close-btn" onclick="backToExerciseSelection()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button>
                    <h3 id="selectedExerciseTitle" style="margin: 0; font-size: 1.2rem; font-weight: 700;">Exercise</h3>
                    <button class="icon-btn check-btn" onclick="submitWorkout()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                </div>
                
                <div id="selectedExerciseIconLarge" style="display: flex; justify-content: center; margin: 30px 0; color: var(--text-primary);">
                </div>

                <div class="reps-input-section" style="margin-top: 10px;" id="repsSection">
                    <label style="font-size: 1rem; color: var(--text-primary); font-weight: 700; display: block; margin-bottom: 12px; text-align: center;">How many reps?</label>
                    <input type="number" id="workoutRepsInput" placeholder="0" class="reps-input" style="width: 100%; box-sizing: border-box; text-align: center; font-size: 2rem; font-weight: 800; padding: 15px; border-radius: 16px;">
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Logged successfully!</div>

    <script src="app.js?v=3.0"></script>
</body>
</html>
