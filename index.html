<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F7F7F7">
</head>
<body>
    <div class="container">
        <!-- View 1: Calendar Home -->
        <div id="homeView">
            <header class="app-header">
                <div class="header-top">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="app-title">STRIVE TO EVOLVE</span>
                    </div>
                </div>
            </header>

            <div class="calendar-card">
                <div class="calendar-header">
                    <h2 id="currentMonthYear">August</h2>
                    <div class="calendar-controls">
                        <button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button>
                        <button class="icon-btn" onclick="prevMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                        <button class="icon-btn" onclick="nextMonth()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="weekdays-row" style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <div class="weekday">S</div>
                        <div class="weekday">M</div>
                        <div class="weekday">T</div>
                        <div class="weekday">W</div>
                        <div class="weekday">T</div>
                        <div class="weekday">F</div>
                        <div class="weekday">S</div>
                    </div>
                    <div id="calendarDays" class="days-grid"></div>
                </div>
            </div>

            <div class="daily-log-section">
                <div class="daily-log-header">
                    <h3 id="selectedDateDisplay">Aug 25</h3>
                    <button class="icon-btn" onclick="openAddWorkoutModal()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                </div>
                <div id="dailyLogList" class="daily-log-list">
                    <!-- Logs injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="floating-nav">
        <div class="nav-item active" onclick="switchView('home')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div class="nav-item add-btn" onclick="openAddWorkoutModal()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <div class="nav-item" onclick="switchView('stats')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-4"></path></svg>
        </div>
    </nav>

    <!-- Add Workout Modal -->
    <div class="modal" id="addWorkoutModal">
        <div class="modal-content add-workout-content">
            <div class="modal-header">
                <button class="icon-btn close-btn" onclick="closeAddWorkoutModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700;">Add Workout</h3>
                <button class="icon-btn check-btn" onclick="submitWorkout()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
            </div>
            
            <!-- Type Selector Dropdown trigger -->
            <div class="type-selector" onclick="toggleDropdown()">
                <span id="selectedExerciseText">Select exercise</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            
            <!-- Dropdown List -->
            <div class="dropdown-list" id="exerciseDropdown">
                <!-- Injected via JS -->
            </div>

            <div class="reps-input-section" style="margin-top: 20px; display: none;" id="repsSection">
                <label style="font-size: 0.9rem; color: #888; font-weight: 600; display: block; margin-bottom: 8px;">Reps (Set)</label>
                <input type="number" id="workoutRepsInput" placeholder="Enter reps" class="reps-input">
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Logged successfully!</div>

    <script src="app.js?v=3.0"></script>
</body>
</html>
